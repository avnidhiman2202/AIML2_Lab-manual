<!DOCTYPE html>
<html>
<head>
    <title>Hotel Room Booking Form</title>
</head>
<body>

<center>
<div style="border: 2px solid black; width: 270px; padding: 15px;">

<h2>Hotel Room Booking Form</h2>

<form>
    Full Name:
    <input type="text" name="name"><br><br>

    Email:
    <input type="email" name="email"><br><br>

    Phone:
    <input type="tel" name="phone"><br><br>

    Check-in Date:
    <input type="date" name="checkin"><br><br>

    Check-out Date:
    <input type="date" name="checkout"><br><br>

    Room Type:
    <select name="room">
        <option>Single Room</option>
        <option>Double Room</option>
        <option>Deluxe Room</option>
    </select><br><br>

    Number of Guests:
    <input type="number" name="guests"><br><br>

    Special Requests:<br>
    <textarea name="requests" rows="4" cols="30"></textarea>
    <br><br>

    <button type="submit">Book Now</button>
    <button type="reset">Reset Form</button>
</form>

</div>
</center>

</body>
</html>
